# Build Android (Gradle) and upload APK/AAB to a GitHub Release
# Triggers:
#  - push of a tag matching v* (e.g. v1.2.3)
#  - manual workflow_dispatch (you can pass `tag` and `release_name` inputs)
name: Android build & release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the release (if omitted, uses ref name)'
        required: false
      release_name:
        description: 'Release name (optional)'
        required: false
      prerelease:
        description: 'Mark release as prerelease?'
        required: false
        default: 'false'

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Install Android command-line tools and SDK (minimal)
        run: |
          set -eux
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          sudo apt-get update
          sudo apt-get install -y wget unzip lib32stdc++6 lib32z1
          # download latest commandlinetools; update URL if Google changes version
          CLI_ZIP=commandlinetools.zip
          wget -q -O "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q "$CLI_ZIP" -d cmdline-tools/temp
          # move to "latest" layout expected by sdkmanager
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/temp/cmdline-tools/* cmdline-tools/latest/ || true
          rm -f "$CLI_ZIP"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2"
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Build release (Gradle)
        run: |
          set -eux
          chmod +x ./gradlew
          # Try assembleRelease first; adjust if your module or task is different.
          ./gradlew clean assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Collect build artifacts
        id: collect
        run: |
          set -eux
          mkdir -p artifacts
          # common APK/AAB output locations — adapt if your module name differs
          # APK(s)
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk artifacts/ || true
          fi
          # Bundle (AAB)
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/*.aab artifacts/ || true
          fi
          # Also check other possible module outputs
          if compgen -G "*/build/outputs/apk/release/*.apk" > /dev/null; then
            cp */build/outputs/apk/release/*.apk artifacts/ || true
          fi
          ls -la artifacts || true
          echo "::set-output name=artifact_count::$(ls artifacts | wc -l || true)"
      - name: Fail if no artifact found
        if: steps.collect.outputs.artifact_count == '0'
        run: |
          echo "No APK/AAB artifacts found in app/build/outputs. Adjust the workflow to match your project layout."
          exit 1

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          release_name: ${{ github.event.inputs.release_name || github.event.inputs.tag || github.ref_name }}
          body: "Automated Android build from workflow."
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ steps.create_release.outputs.upload_url }}
        run: |
          set -eux
          upload_url="${UPLOAD_URL%\{*}"
          echo "Upload URL: $upload_url"
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # set content-type based on extension
            if [[ "$name" == *.apk ]]; then
              content_type="application/vnd.android.package-archive"
            elif [[ "$name" == *.aab ]]; then
              content_type="application/octet-stream"
            else
              content_type="application/octet-stream"
            fi
            echo "Uploading $f as $name"
            curl -sS -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: $content_type" \
              --data-binary @"$f" \
              "$upload_url?name=$name"
          done
